name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Validate catalog data
        run: pnpm data:validate

      - name: Import media assets
        run: pnpm media:import

      - name: Verify guide media coverage
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking every build loadout icon..."
          grep -oE 'asset\("[^"]+"' src/app/App.tsx | sed -E 's/^asset\("//' | sed 's/"$//' | sort -u | while IFS= read -r slug; do
            test -s "public/media/wiki/$slug.png" || { echo "::error::Missing build icon: $slug"; exit 1; }
          done
          echo "Checking all progression boss drops..."
          for slug in eikthyr-trophy hard-antler the-elder-trophy swamp-key bonemass-trophy wishbone moder-trophy dragon-tear yagluth-trophy torn-spirit the-queen-trophy majestic-carapace fader-trophy kindled-ribs sacrificial-blood crown-jewel; do
            test -s "public/media/wiki/$slug.png" || { echo "::error::Missing boss drop icon: $slug"; exit 1; }
          done

      - name: Verify world guide media
        shell: bash
        run: |
          set -euo pipefail
          for slug in anti-sting-concoction berserkir-mead brew-of-animal-whispers draught-of-vananidir lightfoot-mead lingering-eitr-mead lingering-healing-mead love-potion mead-of-troll-endurance medium-stamina-mead tonic-of-ratatosk yule-hat dverger-circlet megingjord ymir-flesh thunder-stone egg barrel-hoops scythe-handle serving-tray crown-of-roots bell-fragment; do
            test -s "public/media/wiki/$slug.png" || { echo "::error::Missing world guide icon: $slug"; exit 1; }
          done

      - name: Verify all trader media
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/const merchantGuides:/,/const dungeonGuides:/p' src/app/App.tsx \
            | grep -oE '"slug": "[^"]+"' \
            | sed -E 's/.*"slug": "([^"]+)".*/\1/' \
            | sort -u \
            | while IFS= read -r slug; do
                test -s "public/media/wiki/$slug.png" || { echo "::error::Missing trader icon: $slug"; exit 1; }
              done

      - name: Verify dungeon loot media
        shell: bash
        run: |
          set -euo pipefail
          for slug in surtling-core bone-fragments troll-hide troll-trophy bear-trophy honey queen-bee brenna-trophy scrap-iron chain fenris-hair fenris-claw crystal geirrhafa-trophy zil-trophy thungr-trophy black-core royal-jelly flametal-ore bell-fragment frostcore mould-nord-sword timberwood ancient-coin draumyx; do
            test -s "public/media/wiki/$slug.png" || { echo "::error::Missing dungeon loot icon: $slug"; exit 1; }
          done

      - name: Verify biome acquisition coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const biomes = ["meadows","black-forest","swamp","mountains","plains","mistlands","ashlands","deep-north","ocean"];
          const files = Object.fromEntries(biomes.map((biome) => [biome, fs.readFileSync(`src/worker/services/seed-${biome}.ts`,"utf8")]));
          const globallySourced = new Set();
          for (const src of Object.values(files)) {
            const start = src.indexOf("resourceSources");
            const ends = [src.indexOf("\n  ]", start), src.indexOf("\n];", start)].filter((x) => x >= 0);
            const end = ends.length ? Math.min(...ends) : src.length;
            const block = start >= 0 ? src.slice(start, end) : "";
            for (const match of block.matchAll(/\["([^"]+)"/g)) globallySourced.add(match[1]);
          }
          let total = 0;
          for (const biome of biomes) {
            const src = files[biome];
            const resources = [...src.matchAll(/\{\s*slug:\s*"([^"]+)",\s*type:\s*"resource"/g)].map((m) => m[1]);
            const missing = resources.filter((slug) => !globallySourced.has(slug));
            if (missing.length) {
              console.error(`${biome}: missing acquisition anywhere in catalog:`, missing);
              process.exit(1);
            }
            total += resources.length;
            console.log(`${biome}: ${resources.length}/${resources.length}`);
          }
          console.log(`All biome resource acquisition coverage: ${total}/${total}`);
          NODE

      - name: Verify early biomes acquisition precision
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const bf = fs.readFileSync("src/worker/services/seed-black-forest.ts","utf8");
          const meadows = fs.readFileSync("src/worker/services/seed-meadows.ts","utf8");
          const ocean = fs.readFileSync("src/worker/services/seed-ocean.ts","utf8");
          for (const line of [
            "Greydwarfs drop 1 Greydwarf Eye at 50%",
            "Greydwarf Brutes drop 1 Ancient Seed at 33%",
            "Trolls always drop 5 Troll Hide",
            "Bears always drop 4–5 Bear Hide",
            "Ghosts in Burial Chambers always drop 1–5 Ectoplasm",
            "Burial Chamber chests roll it at about 2% per roll"
          ]) if (!bf.includes(line)) throw new Error("Missing Black Forest precision source: " + line);
          if (!bf.includes("DELETE FROM resource_sources")) throw new Error("Black Forest must replace stale source rows");
          for (const line of [
            "Deer always drop 1–3 Deer Hide",
            "Boars always drop 1 Boar Meat",
            "Necks drop 1 Neck Tail at 70%",
            "wild Beehives in abandoned houses, Bear Caves",
            "Stone Ship Setting chests roll Wooden Battle Idol at about 2%"
          ]) if (!meadows.includes(line)) throw new Error("Missing Meadows precision source: " + line);
          for (const line of [
            "each mined barnacle yields 3–4 Chitin",
            "Sea Serpents always drop 8–10 Serpent Scales",
            "Sea Serpents always drop 6–8 Serpent Meat",
            "12 catchable fish can be filleted 1:1"
          ]) if (!ocean.includes(line)) throw new Error("Missing Ocean precision source: " + line);
          console.log("Early biomes acquisition precision: ok");
          NODE

      - name: Verify Mountains and Swamp acquisition precision
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const mountains = fs.readFileSync("src/worker/services/seed-mountains.ts","utf8");
          const swamp = fs.readFileSync("src/worker/services/seed-swamp.ts","utf8");
          for (const line of [
            "Stone Golems always drop 8–12 Crystal",
            "Drakes always drop 1–2 Freeze Glands",
            "Wolves have a 40% chance to drop 1 Wolf Fang",
            "Abandoned Mountain log-cabin chests roll Onion Seeds at 14%",
            "Frost Cave chests roll Silver Protection Idol at about 2%"
          ]) if (!mountains.includes(line)) throw new Error("Missing Mountains precision source: " + line);
          for (const line of [
            "Oozers have a 33% chance to drop 1 Scrap Iron",
            "Abominations always drop 5 Root",
            "Wraiths always drop 1 Chain",
            "Sunken Crypt chests roll Scrap Iron at 19%",
            "Abominations always drop 3–5 Guck",
            "Sea Serpents always drop 8–10 Serpent Scales"
          ]) if (!swamp.includes(line)) throw new Error("Missing Swamp precision source: " + line);
          console.log("Mountains + Swamp acquisition precision: ok");
          NODE

      - name: Verify Mistlands and Plains acquisition precision
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const mist = fs.readFileSync("src/worker/services/seed-mistlands.ts","utf8");
          const plains = fs.readFileSync("src/worker/services/seed-plains.ts","utf8");
          for (const line of [
            "Seekers always drop 1–2 Carapace",
            "Seeker Soldiers always drop 2–4 Carapace",
            "Dvergr Mages and Rogues have a 25% chance to drop 1–2 Soft Tissue",
            "Ruined Mistlands guard-tower Dvergr Treasure Chests roll Hook at about 28%",
            "Mörkhalla Ancient Chests in the Deep North roll Black Core at about 7.1%"
          ]) if (!mist.includes(line)) throw new Error("Missing Mistlands precision source: " + line);
          for (const line of [
            "Fulings always drop 1–2 Black Metal Scrap",
            "Fuling Berserkers always drop 3–5 Black Metal Scrap",
            "Lox always drop 4–6 Lox Meat",
            "Deathsquitos always drop 1 Needle",
            "Growths always drop 1 Tar",
            "Fuling Tower trash piles roll it at 1% per roll across 2–3 rolls"
          ]) if (!plains.includes(line)) throw new Error("Missing Plains precision source: " + line);
          console.log("Mistlands + Plains acquisition precision: ok");
          NODE

      - name: Verify Ashlands acquisition precision
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const src = fs.readFileSync("src/worker/services/seed-ashlands.ts","utf8");
          const required = [
            "Adult Asksvin always drop 2–3 Asksvin Hide",
            "Morgen have an 80% chance to drop 1 Morgen Heart",
            "Bonemaw always drops 8–10 Bonemaw Teeth",
            "Fallen Valkyries always drop 2–4 Celestial Feathers",
            "Lava Blobs always drop 1–2 Proustite Powder",
            "Charred Fortress chests: 8% per roll",
            "Magmafish can yield 1–2 Flametal Ore at 23%",
            "Morgen Hole chests roll Ashwood at 19%"
          ];
          for (const line of required) if (!src.includes(line)) throw new Error("Missing Ashlands precision source: " + line);
          const sourceRows = [...src.matchAll(/\["([^"]+)","[^"]+","[^"]+",item\("[^"]+"\)\]/g)];
          console.log("Ashlands acquisition rows:", sourceRows.length);
          if (sourceRows.length < 40) throw new Error("Ashlands precision source table is unexpectedly small");
          NODE

      - name: Verify Deep North acquisition precision
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const src = fs.readFileSync("src/worker/services/seed-deep-north.ts","utf8");
          const count = (slug) => [...src.matchAll(new RegExp('\\["' + slug + '"', 'g'))].length;
          const common = ["mould-nord-sword","mould-nord-axe","mould-nord-mace","mould-nord-spear","mould-nord-bow"];
          const combat = [
            "mould-nord-atgeir","mould-nord-greatsword","mould-nord-greataxe","mould-nord-dagger",
            "mould-nord-knucklechains","mould-nord-crossbow","mould-nord-sledge","mould-nord-shield",
            "mould-nord-greatshield","mould-nord-buckler","mould-lightning-strike","mould-echo-spike",
            "mould-northern-vengeance","mould-spirit-caller"
          ];
          for (const slug of common) if (count(slug) < 4) throw new Error(slug + " should expose at least 4 acquisition routes");
          for (const slug of combat) if (count(slug) < 3) throw new Error(slug + " should expose at least 3 acquisition routes");
          if (count("mould-intricate-key") < 3) throw new Error("intricate key mould needs 3 acquisition routes");
          if (!src.includes("Wardrobes in Winding Tunnels: 50%")) throw new Error("protector helmet wardrobe source missing");
          const required = [
            "North Memorial Place in the Deep North, place 3 Memorial Coal",
            "a memorial can raise up to three warriors",
            "open Mörkhalla with an Intricate Key",
            "start The Jotun Advance",
            "Inside Winding Tunnels, Eyeless Ones drop Mould: Intricate Key at 50%",
            "Inside Winding Tunnels, Elaking drop Mould: Intricate Key at 20%",
            "Kill Krigen inside Mörkhalla: each has a 3% chance",
            "Kill Hexen inside Mörkhalla: each has a 5% chance",
            "Search the Deep North coastline",
            "Hunt wild Moose on the Deep North surface",
            "Explore Winding Tunnels and hunt Elaking inside",
            "Hunt Hexen inside Mörkhalla. Each Hexen has a 10% chance",
            "Pick wild Kale plants in the Deep North",
            "Pick wild Oat plants in the Deep North",
            "Pick wild Poteitr plants in the Deep North",
            "Mörkhalla Ancient Chests and Jotun's Chests each roll a Bloodgold Battle Idol",
            "Mörkhalla Ancient Chests roll a Bloodgold Protection Idol at roughly 0.36%"
          ];
          for (const line of required) if (!src.includes(line)) throw new Error("Missing Deep North acquisition detail: " + line);
          if (!src.includes('["intricate-key","Hexen inside Mörkhalla have a 10% chance')) throw new Error("finished key Hexen drop missing");
          console.log("Deep North acquisition precision: ok");
          NODE

      - name: Verify Deep North valuables precision
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const src = fs.readFileSync("src/worker/services/seed-special-drops.ts","utf8");
          for (const line of [
            "Captive Fulings inside Mörkhalla always drop 1–2 Ancient Coins",
            "Mörkhalla Ancient Chests: 28.5% per roll",
            "Mörkhalla Jotun's Chests: 19.6% per roll",
            "Mörkhalla Ancient Chests roll Grimvarn at about 7.1%",
            "Mörkhalla Ancient Chests roll Solryth at about 5.7%",
            "Mörkhalla Ancient Chests roll Veydris at about 4.3%",
            "Mörkhalla Ancient Chests roll Draumyx at about 2.9%"
          ]) if (!src.includes(line)) throw new Error("Missing Deep North valuables detail: " + line);
          const dn = src.slice(src.indexOf('catalog_special_drops_deep_north_v2_acquisition_detail'));
          if (!dn.includes("replaceResourceSources: true")) throw new Error("Deep North special sources must replace stale rows");
          console.log("Deep North valuables precision: ok");
          NODE

      - name: Verify trophy category integrity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const biomes = ["meadows","black-forest","swamp","mountains","plains","mistlands","ashlands","deep-north","ocean"];
          const bad = [];
          for (const biome of biomes) {
            const src = fs.readFileSync(`src/worker/services/seed-${biome}.ts`,"utf8");
            for (const m of src.matchAll(/\{\s*slug:\s*"([^"]*trophy[^"]*)",\s*type:\s*"resource",\s*category:\s*"([^"]+)"/g)) {
              if (m[2] !== "trophy") bad.push(`${biome}:${m[1]}=${m[2]}`);
            }
          }
          if (bad.length) {
            console.error("Trophy resources miscategorized:", bad);
            process.exit(1);
          }
          console.log("Trophy resource categories: ok");
          NODE

      - name: Production build
        run: pnpm build
