name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Validate catalog data
        run: pnpm data:validate

      - name: Import media assets
        run: pnpm media:import

      - name: Verify guide media coverage
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking every build loadout icon..."
          grep -oE 'asset\("[^"]+"' src/app/App.tsx | sed -E 's/^asset\("//' | sed 's/"$//' | sort -u | while IFS= read -r slug; do
            test -s "public/media/wiki/$slug.png" || { echo "::error::Missing build icon: $slug"; exit 1; }
          done
          echo "Checking all progression boss drops..."
          for slug in eikthyr-trophy hard-antler the-elder-trophy swamp-key bonemass-trophy wishbone moder-trophy dragon-tear yagluth-trophy torn-spirit the-queen-trophy majestic-carapace fader-trophy kindled-ribs sacrificial-blood crown-jewel; do
            test -s "public/media/wiki/$slug.png" || { echo "::error::Missing boss drop icon: $slug"; exit 1; }
          done

      - name: Production build
        run: pnpm build
