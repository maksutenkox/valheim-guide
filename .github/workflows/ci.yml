name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Validate catalog data
        run: pnpm data:validate

      - name: Import media assets
        run: pnpm media:import

      - name: Verify guide media coverage
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking every build loadout icon..."
          grep -oE 'asset\("[^"]+"' src/app/App.tsx | sed -E 's/^asset\("//' | sed 's/"$//' | sort -u | while IFS= read -r slug; do
            test -s "public/media/wiki/$slug.png" || { echo "::error::Missing build icon: $slug"; exit 1; }
          done
          echo "Checking all progression boss drops..."
          for slug in eikthyr-trophy hard-antler the-elder-trophy swamp-key bonemass-trophy wishbone moder-trophy dragon-tear yagluth-trophy torn-spirit the-queen-trophy majestic-carapace fader-trophy kindled-ribs sacrificial-blood crown-jewel; do
            test -s "public/media/wiki/$slug.png" || { echo "::error::Missing boss drop icon: $slug"; exit 1; }
          done

      - name: Verify world guide media
        shell: bash
        run: |
          set -euo pipefail
          for slug in anti-sting-concoction berserkir-mead brew-of-animal-whispers draught-of-vananidir lightfoot-mead lingering-eitr-mead lingering-healing-mead love-potion mead-of-troll-endurance medium-stamina-mead tonic-of-ratatosk yule-hat dverger-circlet megingjord ymir-flesh thunder-stone egg barrel-hoops scythe-handle serving-tray crown-of-roots bell-fragment; do
            test -s "public/media/wiki/$slug.png" || { echo "::error::Missing world guide icon: $slug"; exit 1; }
          done

      - name: Verify all trader media
        shell: bash
        run: |
          set -euo pipefail
          sed -n '/const merchantGuides:/,/const dungeonGuides:/p' src/app/App.tsx \
            | grep -oE '"slug": "[^"]+"' \
            | sed -E 's/.*"slug": "([^"]+)".*/\1/' \
            | sort -u \
            | while IFS= read -r slug; do
                test -s "public/media/wiki/$slug.png" || { echo "::error::Missing trader icon: $slug"; exit 1; }
              done

      - name: Verify dungeon loot media
        shell: bash
        run: |
          set -euo pipefail
          for slug in surtling-core bone-fragments troll-hide troll-trophy bear-trophy honey queen-bee brenna-trophy scrap-iron chain fenris-hair fenris-claw crystal geirrhafa-trophy zil-trophy thungr-trophy black-core royal-jelly flametal-ore bell-fragment frostcore mould-nord-sword timberwood ancient-coin draumyx; do
            test -s "public/media/wiki/$slug.png" || { echo "::error::Missing dungeon loot icon: $slug"; exit 1; }
          done

      - name: Verify biome acquisition coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const biomes = ["meadows","black-forest","swamp","mountains","plains","mistlands","ashlands","deep-north","ocean"];
          let total = 0;
          for (const biome of biomes) {
            const src = fs.readFileSync(`src/worker/services/seed-${biome}.ts`,"utf8");
            const resources = [...src.matchAll(/\{\s*slug:\s*"([^"]+)",\s*type:\s*"resource"/g)].map((m) => m[1]);
            const start = src.indexOf("resourceSources");
            const ends = [src.indexOf("\n  ]", start), src.indexOf("\n];", start)].filter((x) => x >= 0);
            const end = ends.length ? Math.min(...ends) : src.length;
            const block = start >= 0 ? src.slice(start, end) : "";
            const sourced = new Set([...block.matchAll(/\["([^"]+)"/g)].map((m) => m[1]));
            const missing = resources.filter((slug) => !sourced.has(slug));
            if (missing.length) {
              console.error(`${biome}: missing acquisition:`, missing);
              process.exit(1);
            }
            total += resources.length;
            console.log(`${biome}: ${resources.length}/${resources.length}`);
          }
          console.log(`All biome resource acquisition coverage: ${total}/${total}`);
          NODE

      - name: Verify Deep North acquisition precision
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const src = fs.readFileSync("src/worker/services/seed-deep-north.ts","utf8");
          const count = (slug) => [...src.matchAll(new RegExp('\\["' + slug + '"', 'g'))].length;
          const common = ["mould-nord-sword","mould-nord-axe","mould-nord-mace","mould-nord-spear","mould-nord-bow"];
          const combat = [
            "mould-nord-atgeir","mould-nord-greatsword","mould-nord-greataxe","mould-nord-dagger",
            "mould-nord-knucklechains","mould-nord-crossbow","mould-nord-sledge","mould-nord-shield",
            "mould-nord-greatshield","mould-nord-buckler","mould-lightning-strike","mould-echo-spike",
            "mould-northern-vengeance","mould-spirit-caller"
          ];
          for (const slug of common) if (count(slug) < 4) throw new Error(slug + " should expose at least 4 acquisition routes");
          for (const slug of combat) if (count(slug) < 3) throw new Error(slug + " should expose at least 3 acquisition routes");
          if (count("mould-intricate-key") < 3) throw new Error("intricate key mould needs 3 acquisition routes");
          if (!src.includes("Wardrobes in Winding Tunnels: 50%")) throw new Error("protector helmet wardrobe source missing");
          if (!src.includes('["intricate-key","Hexen can drop a finished Intricate Key at 10%')) throw new Error("finished key Hexen drop missing");
          console.log("Deep North acquisition precision: ok");
          NODE

      - name: Verify trophy category integrity
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const biomes = ["meadows","black-forest","swamp","mountains","plains","mistlands","ashlands","deep-north","ocean"];
          const bad = [];
          for (const biome of biomes) {
            const src = fs.readFileSync(`src/worker/services/seed-${biome}.ts`,"utf8");
            for (const m of src.matchAll(/\{\s*slug:\s*"([^"]*trophy[^"]*)",\s*type:\s*"resource",\s*category:\s*"([^"]+)"/g)) {
              if (m[2] !== "trophy") bad.push(`${biome}:${m[1]}=${m[2]}`);
            }
          }
          if (bad.length) {
            console.error("Trophy resources miscategorized:", bad);
            process.exit(1);
          }
          console.log("Trophy resource categories: ok");
          NODE

      - name: Production build
        run: pnpm build
