name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  deployments: write

concurrency:
  group: valheim-guide-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import media assets
        run: pnpm media:import

      - name: Production build
        run: pnpm build

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.142.0"
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://valheim-guide.partiya-odobryaet-bot.workers.dev"

          echo "Waiting for deployed build to propagate..."
          VERSION_JSON=""
          for attempt in $(seq 1 15); do
            VERSION_JSON="$(curl --fail --silent --show-error "$BASE_URL/api/version" || true)"
            echo "Attempt $attempt: $VERSION_JSON"
            if echo "$VERSION_JSON" | grep -q '"build":"2026-09-29-world-v6-complete-pass1"'; then
              break
            fi
            sleep 2
          done
          echo "$VERSION_JSON" | grep -q '"build":"2026-09-29-world-v6-complete-pass1"'

          echo "Checking D1 health..."
          HEALTH_JSON="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE_URL/api/health")"
          echo "$HEALTH_JSON"
          echo "$HEALTH_JSON" | grep -q '"status":"ok"'
          echo "$HEALTH_JSON" | grep -q '"database":"connected"'

          echo "Waiting for catalog propagation..."
          CATALOG_JSON=""
          for attempt in $(seq 1 15); do
            CATALOG_JSON="$(curl --fail --silent --show-error "$BASE_URL/api/catalog-status" || true)"
            echo "Catalog attempt $attempt: $CATALOG_JSON"
            if echo "$CATALOG_JSON" | grep -q '"catalog":"world-v6"'; then
              break
            fi
            sleep 2
          done
          echo "$CATALOG_JSON" | grep -q '"catalog":"world-v6"'
          echo "$CATALOG_JSON" | grep -q '"meadows"'
          echo "$CATALOG_JSON" | grep -q '"black-forest"'
          echo "$CATALOG_JSON" | grep -q '"swamp"'
          echo "$CATALOG_JSON" | grep -q '"mountains"'
          echo "$CATALOG_JSON" | grep -q '"plains"'
          echo "$CATALOG_JSON" | grep -q '"mistlands"'
          echo "$CATALOG_JSON" | grep -q '"ashlands"'
          echo "$CATALOG_JSON" | grep -q '"deep-north"'
          echo "$CATALOG_JSON" | grep -q '"ocean"'
          MEADOWS_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"meadows":{"items":\([0-9][0-9]*\).*/\1/p')"
          OCEAN_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"ocean":{"items":\([0-9][0-9]*\).*/\1/p')"
          MOUNTAIN_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"mountains":{"items":\([0-9][0-9]*\).*/\1/p')"
          PLAINS_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"plains":{"items":\([0-9][0-9]*\).*/\1/p')"
          MISTLANDS_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"mistlands":{"items":\([0-9][0-9]*\).*/\1/p')"
          ASHLANDS_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"ashlands":{"items":\([0-9][0-9]*\).*/\1/p')"
          DEEP_NORTH_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"deep-north":{"items":\([0-9][0-9]*\).*/\1/p')"
          test -n "$MOUNTAIN_ITEMS" && test "$MOUNTAIN_ITEMS" -gt 20
          test -n "$PLAINS_ITEMS" && test "$PLAINS_ITEMS" -gt 30
          test -n "$MISTLANDS_ITEMS" && test "$MISTLANDS_ITEMS" -gt 40
          test -n "$ASHLANDS_ITEMS" && test "$ASHLANDS_ITEMS" -gt 40
          test -n "$DEEP_NORTH_ITEMS" && test "$DEEP_NORTH_ITEMS" -gt 70
          test -n "$MEADOWS_ITEMS" && test "$MEADOWS_ITEMS" -gt 30
          test -n "$OCEAN_ITEMS" && test "$OCEAN_ITEMS" -gt 5

          echo "Checking Telegram bot secret presence without exposing it..."
          AUTH_RESPONSE="$(curl --silent --show-error -H 'x-telegram-init-data: smoke-test' "$BASE_URL/api/auth-status")"
          echo "$AUTH_RESPONSE"
          if echo "$AUTH_RESPONSE" | grep -q 'Telegram bot token is not configured'; then
            echo "::error::Production Worker is missing TELEGRAM_BOT_TOKEN"
            exit 1
          fi
          echo "$AUTH_RESPONSE" | grep -Eq 'Invalid Telegram authorization data|Telegram authorization signature is invalid'

          echo "Checking production media assets..."
          for asset in copper-ore bronze-protection-idol pulled-bear scrap-iron iron-sword root-mask black-soup silver-ore frostner draugr-fang fenris-hood onion-soup black-metal-scrap black-metal-sword padded-helmet lox-fur-hood evasion-mantle lox-meat-pie refined-eitr mistwalker carapace-helmet staff-of-embers pulsating-earrings seeker-aspic-x2 flametal nidhogg berserkir-axes flametal-helmet hood-of-embla fiery-svinstew bloodgold timberwood nord-axe frostfire-axe thunderblood-axe helmet-of-the-protector cape-of-the-caller fish-soup neckstabber stone-axe wood-shield rag-tunic workbench chitin abyssal-harpoon raw-fish; do
            CONTENT_TYPE=""
            for attempt in $(seq 1 12); do
              CONTENT_TYPE="$(curl --silent --show-error -o /dev/null -w '%{content_type}' "$BASE_URL/media/wiki/$asset.png" || true)"
              echo "$asset attempt $attempt: $CONTENT_TYPE"
              if echo "$CONTENT_TYPE" | grep -q '^image/'; then
                break
              fi
              sleep 2
            done
            echo "$CONTENT_TYPE" | grep -q '^image/'
          done
