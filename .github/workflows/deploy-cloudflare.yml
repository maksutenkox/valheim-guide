name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  deployments: write

concurrency:
  group: valheim-guide-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import media assets
        run: pnpm media:import

      - name: Production build
        run: pnpm build

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.142.0"
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote deployed Worker version
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          set -euo pipefail
          VERSION_ID="$(printf '%s\n' "$WRANGLER_OUTPUT" | sed -n 's/.*Current Version ID: \([0-9a-f-][0-9a-f-]*\).*/\1/p' | tail -n 1)"
          if [ -z "$VERSION_ID" ]; then
            echo "::error::Could not extract the uploaded Worker Version ID"
            printf '%s\n' "$WRANGLER_OUTPUT"
            exit 1
          fi
          echo "Promoting Worker version $VERSION_ID to 100% of production traffic..."
          npx --yes wrangler@4.142.0 versions deploy "$VERSION_ID@100%" --yes

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://valheim-guide.partiya-odobryaet-bot.workers.dev"

          EXPECTED_BUILD="$(sed -n 's/.*APP_BUILD = "\([^"]*\)".*/\1/p' src/shared/build.ts)"
          test -n "$EXPECTED_BUILD"
          echo "Waiting for deployed build $EXPECTED_BUILD to propagate..."
          VERSION_JSON=""
          for attempt in $(seq 1 30); do
            VERSION_JSON="$(curl --fail --silent --show-error "$BASE_URL/api/version" || true)"
            echo "Attempt $attempt: $VERSION_JSON"
            if echo "$VERSION_JSON" | grep -Fq "\"build\":\"$EXPECTED_BUILD\""; then
              break
            fi
            sleep 2
          done
          echo "$VERSION_JSON" | grep -Fq "\"build\":\"$EXPECTED_BUILD\""

          echo "Checking D1 health..."
          HEALTH_JSON="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE_URL/api/health")"
          echo "$HEALTH_JSON"
          echo "$HEALTH_JSON" | grep -q '"status":"ok"'
          echo "$HEALTH_JSON" | grep -q '"database":"connected"'

          echo "Waiting for catalog propagation..."
          CATALOG_JSON=""
          for attempt in $(seq 1 15); do
            CATALOG_JSON="$(curl --fail --silent --show-error "$BASE_URL/api/catalog-status" || true)"
            echo "Catalog attempt $attempt: $CATALOG_JSON"
            if echo "$CATALOG_JSON" | grep -q '"catalog":"world-v6"'; then
              break
            fi
            sleep 2
          done
          echo "$CATALOG_JSON" | grep -q '"catalog":"world-v6"'
          echo "$CATALOG_JSON" | grep -q '"meadows"'
          echo "$CATALOG_JSON" | grep -q '"black-forest"'
          echo "$CATALOG_JSON" | grep -q '"swamp"'
          echo "$CATALOG_JSON" | grep -q '"mountains"'
          echo "$CATALOG_JSON" | grep -q '"plains"'
          echo "$CATALOG_JSON" | grep -q '"mistlands"'
          echo "$CATALOG_JSON" | grep -q '"ashlands"'
          echo "$CATALOG_JSON" | grep -q '"deep-north"'
          echo "$CATALOG_JSON" | grep -q '"ocean"'

          echo "Checking creature and boss combat guide..."
          CREATURES_JSON="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE_URL/api/creatures?biome=ashlands")"
          echo "$CREATURES_JSON"
          echo "$CREATURES_JSON" | grep -q '"slug":"morgen"'
          echo "$CREATURES_JSON" | grep -q '"slug":"fallen-valkyrie"'

          MORGEN_JSON="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE_URL/api/creatures/morgen")"
          echo "$MORGEN_JSON"
          echo "$MORGEN_JSON" | grep -q '"health":1600'
          echo "$MORGEN_JSON" | grep -q '"type":"lightning","level":"weak"'
          echo "$MORGEN_JSON" | grep -q '"name":"Morgen Sinew"'
          echo "$MORGEN_JSON" | grep -q '"slug":"morgen-sinew"'
          echo "$MORGEN_JSON" | grep -q '"image_path":"/media/wiki/morgen-sinew.png"'

          MORGEN_SINEW_JSON="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE_URL/api/resources/morgen-sinew")"
          echo "$MORGEN_SINEW_JSON"
          echo "$MORGEN_SINEW_JSON" | grep -q '"dropped_by"'
          echo "$MORGEN_SINEW_JSON" | grep -q '"slug":"morgen"'
          echo "$MORGEN_SINEW_JSON" | grep -q '"slug":"slayer"'
          echo "$MORGEN_SINEW_JSON" | grep -q '"slug":"ripper"'

          BOSS_JSON="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE_URL/api/bosses?biome=ashlands")"
          echo "$BOSS_JSON"
          echo "$BOSS_JSON" | grep -q '"slug":"fader"'
          echo "$BOSS_JSON" | grep -q '"health":25000'

          echo "Checking food builder and taming guide..."
          FOODS_JSON="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE_URL/api/foods")"
          echo "$FOODS_JSON"
          echo "$FOODS_JSON" | grep -q '"slug":"cooked-boar-meat"'
          echo "$FOODS_JSON" | grep -q '"health":'
          echo "$FOODS_JSON" | grep -q '"stamina":'
          echo "$FOODS_JSON" | grep -q '"slug":"fish-soup"'
          echo "$FOODS_JSON" | grep -q '"eitr":'

          TAMING_JSON="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE_URL/api/taming")"
          echo "$TAMING_JSON"
          echo "$TAMING_JSON" | grep -q '"slug":"boar"'
          echo "$TAMING_JSON" | grep -q '"slug":"asksvin"'
          echo "$TAMING_JSON" | grep -q '"slug":"moose"'
          echo "$TAMING_JSON" | grep -q '"slug":"lingonberries"'

          echo "Checking trophy collection catalog..."
          TROPHIES_JSON="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE_URL/api/trophies")"
          TROPHY_SLUGS="$(sed -n 's/^[[:space:]]*\["\([^"]*\)".*/\1/p' src/worker/services/seed-trophies.ts)"
          TROPHY_COUNT="$(printf '%s\n' "$TROPHY_SLUGS" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "Expected trophy count: $TROPHY_COUNT"
          test "$TROPHY_COUNT" = "70"
          API_TROPHY_COUNT="$(printf '%s' "$TROPHIES_JSON" | grep -o '"category_slug":"trophy"' | wc -l | tr -d ' ')"
          echo "Production trophy count: $API_TROPHY_COUNT"
          test "$API_TROPHY_COUNT" = "70"
          while IFS= read -r trophy_slug; do
            test -n "$trophy_slug" || continue
            printf '%s' "$TROPHIES_JSON" | grep -Fq "\"slug\":\"$trophy_slug\""
          done <<< "$TROPHY_SLUGS"

          MEADOWS_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"meadows":{"items":\([0-9][0-9]*\).*/\1/p')"
          OCEAN_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"ocean":{"items":\([0-9][0-9]*\).*/\1/p')"
          MOUNTAIN_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"mountains":{"items":\([0-9][0-9]*\).*/\1/p')"
          PLAINS_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"plains":{"items":\([0-9][0-9]*\).*/\1/p')"
          MISTLANDS_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"mistlands":{"items":\([0-9][0-9]*\).*/\1/p')"
          ASHLANDS_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"ashlands":{"items":\([0-9][0-9]*\).*/\1/p')"
          DEEP_NORTH_ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"deep-north":{"items":\([0-9][0-9]*\).*/\1/p')"
          test -n "$MOUNTAIN_ITEMS" && test "$MOUNTAIN_ITEMS" -gt 20
          test -n "$PLAINS_ITEMS" && test "$PLAINS_ITEMS" -gt 30
          test -n "$MISTLANDS_ITEMS" && test "$MISTLANDS_ITEMS" -gt 40
          test -n "$ASHLANDS_ITEMS" && test "$ASHLANDS_ITEMS" -gt 40
          test -n "$DEEP_NORTH_ITEMS" && test "$DEEP_NORTH_ITEMS" -gt 70
          test -n "$MEADOWS_ITEMS" && test "$MEADOWS_ITEMS" -gt 30
          test -n "$OCEAN_ITEMS" && test "$OCEAN_ITEMS" -gt 5

          echo "Checking Telegram bot secret presence without exposing it..."
          AUTH_RESPONSE="$(curl --silent --show-error -H 'x-telegram-init-data: smoke-test' "$BASE_URL/api/auth-status")"
          echo "$AUTH_RESPONSE"
          if echo "$AUTH_RESPONSE" | grep -q 'Telegram bot token is not configured'; then
            echo "::error::Production Worker is missing TELEGRAM_BOT_TOKEN"
            exit 1
          fi
          echo "$AUTH_RESPONSE" | grep -Eq 'Invalid Telegram authorization data|Telegram authorization signature is invalid'

          echo "Checking production media assets..."
          for asset in copper-ore bronze-protection-idol pulled-bear scrap-iron iron-sword root-mask black-soup silver-ore frostner draugr-fang fenris-hood onion-soup black-metal-scrap black-metal-sword padded-helmet lox-fur-hood evasion-mantle lox-meat-pie refined-eitr mistwalker carapace-helmet staff-of-embers pulsating-earrings seeker-aspic-x2 flametal nidhogg berserkir-axes flametal-helmet hood-of-embla fiery-svinstew bloodgold timberwood nord-axe frostfire-axe thunderblood-axe helmet-of-the-protector cape-of-the-caller fish-soup neckstabber stone-axe wood-shield rag-tunic workbench chitin abyssal-harpoon raw-fish; do
            CONTENT_TYPE=""
            for attempt in $(seq 1 12); do
              CONTENT_TYPE="$(curl --silent --show-error -o /dev/null -w '%{content_type}' "$BASE_URL/media/wiki/$asset.png" || true)"
              echo "$asset attempt $attempt: $CONTENT_TYPE"
              if echo "$CONTENT_TYPE" | grep -q '^image/'; then
                break
              fi
              sleep 2
            done
            echo "$CONTENT_TYPE" | grep -q '^image/'
          done

          echo "Checking all trophy images..."
          TROPHY_SLUGS="$(sed -n 's/^[[:space:]]*\["\([^"]*\)".*/\1/p' src/worker/services/seed-trophies.ts)"
          while IFS= read -r trophy_slug; do
            test -n "$trophy_slug" || continue
            CONTENT_TYPE=""
            for attempt in $(seq 1 5); do
              CONTENT_TYPE="$(curl --silent --show-error -o /dev/null -w '%{content_type}' "$BASE_URL/media/wiki/$trophy_slug.png" || true)"
              if echo "$CONTENT_TYPE" | grep -q '^image/'; then
                break
              fi
              sleep 1
            done
            echo "$trophy_slug: $CONTENT_TYPE"
            echo "$CONTENT_TYPE" | grep -q '^image/'
          done <<< "$TROPHY_SLUGS"

          echo "Checking fishing encyclopedia media..."
          for asset in fishing-rod fishing-hat fishing-bait mossy-fishing-bait sticky-fishing-bait cold-fishing-bait stingy-fishing-bait heavy-fishing-bait misty-fishing-bait hot-fishing-bait frosty-fishing-bait perch pike tuna tetra trollfish giant-herring grouper coral-cod anglerfish northern-salmon magmafish pufferfish; do
            CONTENT_TYPE="$(curl --fail --silent --show-error -o /dev/null -w '%{content_type}' --retry 4 --retry-delay 1 "$BASE_URL/media/wiki/$asset.png")"
            echo "$asset: $CONTENT_TYPE"
            echo "$CONTENT_TYPE" | grep -q '^image/'
          done

          echo "Checking every boss drop icon..."
          for boss in eikthyr the-elder bonemass moder yagluth the-queen fader kall-fimbulbringer; do
            BOSS_DETAIL="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$BASE_URL/api/creatures/$boss")"
            MISSING_DROP_ICONS="$(printf '%s' "$BOSS_DETAIL" | node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(0,"utf8")).data;process.stdout.write(String((d.drops||[]).filter(x=>!x.image_path).length))')"
            echo "$boss missing drop icons: $MISSING_DROP_ICONS"
            test "$MISSING_DROP_ICONS" = "0"
            DROP_PATHS="$(printf '%s' "$BOSS_DETAIL" | node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(0,"utf8")).data;process.stdout.write((d.drops||[]).map(x=>x.image_path).filter(Boolean).join("\n"))')"
            while IFS= read -r drop_path; do
              test -n "$drop_path" || continue
              CONTENT_TYPE="$(curl --fail --silent --show-error -o /dev/null -w '%{content_type}' --retry 4 --retry-delay 1 "$BASE_URL$drop_path")"
              echo "$boss $drop_path: $CONTENT_TYPE"
              echo "$CONTENT_TYPE" | grep -q '^image/'
            done <<< "$DROP_PATHS"
          done
