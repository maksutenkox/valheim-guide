name: Deploy Cloudflare

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  deployments: write

concurrency:
  group: valheim-guide-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.142.0"
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://valheim-guide.partiya-odobryaet-bot.workers.dev"

          echo "Checking deployed build..."
          VERSION_JSON="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE_URL/api/version")"
          echo "$VERSION_JSON"
          echo "$VERSION_JSON" | grep -q '"build":"2026-09-29-black-forest-v4-craft-v3"'

          echo "Checking D1 health..."
          HEALTH_JSON="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE_URL/api/health")"
          echo "$HEALTH_JSON"
          echo "$HEALTH_JSON" | grep -q '"status":"ok"'
          echo "$HEALTH_JSON" | grep -q '"database":"connected"'

          echo "Checking Black Forest catalog..."
          CATALOG_JSON="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE_URL/api/catalog-status")"
          echo "$CATALOG_JSON"
          echo "$CATALOG_JSON" | grep -q '"catalog":"black-forest-v4"'
          ITEMS="$(echo "$CATALOG_JSON" | sed -n 's/.*"items":\([0-9][0-9]*\).*/\1/p')"
          RECIPES="$(echo "$CATALOG_JSON" | sed -n 's/.*"recipes":\([0-9][0-9]*\).*/\1/p')"
          test -n "$ITEMS" && test "$ITEMS" -gt 0
          test -n "$RECIPES" && test "$RECIPES" -gt 0

          echo "Checking Telegram bot secret presence without exposing it..."
          AUTH_RESPONSE="$(curl --silent --show-error -H 'x-telegram-init-data: smoke-test' "$BASE_URL/api/auth-status")"
          echo "$AUTH_RESPONSE"
          if echo "$AUTH_RESPONSE" | grep -q 'Telegram bot token is not configured'; then
            echo "::error::Production Worker is missing TELEGRAM_BOT_TOKEN"
            exit 1
          fi
          echo "$AUTH_RESPONSE" | grep -Eq 'Invalid Telegram authorization data|Telegram authorization signature is invalid'
